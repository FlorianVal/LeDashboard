services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    container_name: nas-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
